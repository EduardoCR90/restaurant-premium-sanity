name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source:
        description: Motivo de la reconstrucción
        required: false
        default: manual
        type: choice
        options: [manual, sanity]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://eduardocr90.github.io
      SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID || 'hfa8zkyw' }}
      SANITY_DATASET: ${{ vars.SANITY_DATASET || 'production' }}
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
      SANITY_USE_MOCK: 'false'
      SANITY_ALLOW_DEMO_FALLBACK: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, validate, build and upload with the official Astro action
        uses: withastro/action@v6
        with:
          node-version: 22
          build-cmd: npm run check && npm test && npm run build && npm run check:build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy static demo
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify public pages and local assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = process.env.PAGE_URL;
          const assets = new Set();
          for (const route of ['', 'carta/', 'restaurante/', 'reservas/']) {
            const url = new URL(route, base);
            const response = await fetch(url, { signal: AbortSignal.timeout(30000) });
            assert.equal(response.status, 200, url.href);
            const html = await response.text();
            assert.ok(html.includes('<h1') && /<title>[^<]+<\/title>/.test(html), `Contenido inesperado: ${url}`);
            const image = html.match(/property="og:image"\s+content="([^"]+)"/);
            assert.ok(image?.[1]?.startsWith('https://'), `Imagen social: ${url}`);
            assert.ok(html.includes('name="twitter:image"'), `Falta Twitter image: ${url}`);
            assets.add(image[1].replaceAll('&amp;', '&'));
            for (const match of html.matchAll(/(?:href|src)="([^"]+)"/g)) {
              const asset = new URL(match[1].replaceAll('&amp;', '&'), url);
              if (asset.origin === url.origin && /\.(css|svg)$/.test(asset.pathname)) assets.add(asset.href);
            }
            console.log(`HTTP 200: ${url}`);
          }
          assert.ok(assets.size >= 2, 'No se encontraron CSS y favicon');
          for (const url of assets) {
            const response = await fetch(url, { signal: AbortSignal.timeout(30000) });
            assert.equal(response.status, 200, url);
            if (url.endsWith('.jpg')) {
              assert.ok(response.headers.get('content-type')?.startsWith('image/jpeg'));
              const bytes = new Uint8Array(await response.arrayBuffer());
              assert.ok(bytes.length > 1000 && bytes[0] === 255 && bytes[1] === 216, 'JPEG social inválido');
            }
            console.log(`Recurso HTTP 200: ${url}`);
          }
          JS
