name: Validate Astro and Sanity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Cambiar a npm ci y activar cache npm al generar el primer package-lock.json.
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run seed:export
      - name: Dependency audit report
        run: |
          npm audit --json > audit.json || true
          node -e 'const a=require("./audit.json"); for (const [n,v] of Object.entries(a.vulnerabilities||{})) console.log(n, v.severity, JSON.stringify(v.via), "fix:", JSON.stringify(v.fixAvailable))'
      - uses: actions/upload-artifact@v4
        with:
          name: salitre-static-review
          path: |
            dist/
            package-lock.json
            audit.json
          retention-days: 7
      - run: npm run studio:build
      - run: test -f studio-dist/index.html
        env:
          SANITY_STUDIO_PROJECT_ID: abc123de
          SANITY_STUDIO_DATASET: production
